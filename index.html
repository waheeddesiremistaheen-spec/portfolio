<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />

    <title>Desire — Software Developer &amp; Builder</title>
    <meta
      name="description"
      content="Desire is a Computer Science student and software developer who builds AI-powered products, web applications, 3D experiences and developer tools. I build technology that solves real problems."
    />
    <meta name="author" content="Desire" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Desire — Software Developer &amp; Builder" />
    <meta property="og:title" content="Desire — Software Developer &amp; Builder" />
    <meta
      property="og:description"
      content="I build technology that solves real problems — AI products, web applications, 3D experiences and developer tools."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://desire.dev/" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Desire — Software Developer &amp; Builder" />
    <meta
      name="twitter:description"
      content="I build technology that solves real problems — AI products, web applications, 3D experiences and developer tools."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Desire",
        "jobTitle": "Software Developer",
        "description": "Computer Science student and software developer building AI-powered products, web applications, 3D experiences and developer tools.",
        "knowsAbout": [
          "Software Development",
          "Artificial Intelligence",
          "Web Development",
          "3D Technology",
          "Computer Vision",
          "Automation"
        ]
      }
    </script>

    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong theme.
      ;(function () {
        try {
          var stored = localStorage.getItem('desire-theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          /* storage unavailable — keep default dark */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
